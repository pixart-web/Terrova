name: Release Candidate CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: terrova
          POSTGRES_USER: terrova
          POSTGRES_PASSWORD: terrova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terrova -d terrova"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://terrova:terrova@127.0.0.1:5432/terrova
      PAYLOAD_SECRET: terrova-ci-only-secret-with-at-least-32-characters
      CMS_URL: http://127.0.0.1:3001
      WEB_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_CMS_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      CMS_SERVICE_TOKEN: terrova-ci-service-token-with-at-least-32-characters
      COMMERCE_MODE: test
      ALLOW_TEST_COMMERCE: true
      ALLOW_CONTENT_FIXTURES: false
      SEED_TEST_CUSTOMER_EMAIL: release-test@terrova.local
      SEED_TEST_CUSTOMER_PASSWORD: local-release-test-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate formatting, lint, types, and builds
        run: pnpm check

      - name: Run unit tests
        run: pnpm test:unit

      - name: Apply database migrations and seed reference data
        run: |
          pnpm cms:migrate
          pnpm cms:seed

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start local applications
        run: |
          pnpm dev > /tmp/terrova-dev.log 2>&1 &
          echo $! > /tmp/terrova-dev.pid

      - name: Run functional smoke tests
        run: pnpm test:functional

      - name: Run release candidate E2E
        run: pnpm test:e2e

      - name: Upload E2E evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      - name: Print application logs on failure
        if: failure()
        run: cat /tmp/terrova-dev.log || true
