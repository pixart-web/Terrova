name: Foundation CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: terrova
          POSTGRES_USER: terrova
          POSTGRES_PASSWORD: terrova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terrova -d terrova"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://terrova:terrova@127.0.0.1:5432/terrova
      PAYLOAD_SECRET: terrova-ci-only-secret-with-at-least-32-characters
      CMS_URL: http://127.0.0.1:3001
      WEB_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_CMS_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate formatting, lint, types, and builds
        run: pnpm check

      - name: Start local applications
        run: |
          pnpm dev > /tmp/terrova-dev.log 2>&1 &
          echo $! > /tmp/terrova-dev.pid

      - name: Run functional smoke tests
        run: pnpm test:functional

      - name: Print application logs on failure
        if: failure()
        run: cat /tmp/terrova-dev.log || true
