services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ${TERROVA_ENV_FILE:-.env.production}
    volumes:
      - terrova_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    restart: unless-stopped
    env_file: ${TERROVA_ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy
    ports: ['3001:3001']
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3001/api/health']
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: ${TERROVA_ENV_FILE:-.env.production}
    depends_on:
      cms:
        condition: service_healthy
    ports: ['3000:3000']
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  terrova_postgres_data:
